<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecStreet Library</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
<style>
.lib-shell{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh;background:var(--ink)}
.lib-left{display:flex;flex-direction:column;border-right:1px solid var(--hair);overflow:hidden}
.lib-header{padding:18px 20px 14px;border-bottom:1px solid var(--hair);background:var(--bg)}
.lib-brand{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:10px}
.lib-brand a{color:inherit;text-decoration:none}
.lib-search{width:100%;padding:10px 14px;background:var(--ink);border:1px solid var(--hair);color:var(--cream);font-family:var(--mono);font-size:13px;border-radius:5px}
.lib-search:focus{box-shadow:var(--glow-gold);border-color:var(--gold-lo)}
.lib-count{font-size:10.5px;color:var(--cream-3);margin-top:8px;font-family:var(--mono)}
.lib-list{flex:1;overflow-y:auto}
.lib-row{padding:11px 20px;border-bottom:1px solid var(--hair-soft);cursor:pointer;border-left:2px solid transparent;transition:background .1s}
.lib-row:hover{background:var(--bg)}
.lib-row.active{background:var(--bg);border-left-color:var(--gold)}
.lib-row .lname{color:var(--cream);font-family:var(--mono);font-size:12.5px;margin-bottom:3px}
.lib-row .ldesc{color:var(--cream-2);font-size:11.5px;line-height:1.45;margin-bottom:5px}
.lib-row .lmeta{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--cream-3);font-family:var(--mono)}
.lib-right{display:flex;flex-direction:column;overflow:hidden}
.lib-detail{flex:1;overflow-y:auto;padding:24px 32px}
.lib-detail h1{font-size:20px;color:var(--cream);font-weight:600;margin-bottom:4px;font-family:var(--mono)}
.lib-detail .ddesc{color:var(--cream-2);font-size:14px;line-height:1.6;margin:14px 0 20px}
.lib-detail .dcrumb{font-size:11px;color:var(--cream-3);font-family:var(--mono);letter-spacing:.02em}
.lib-detail .dcrumb a{color:var(--gold);text-decoration:none}
.lib-detail .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:12.5px;margin-bottom:22px}
.lib-detail .kv .k{color:var(--cream-4);text-transform:uppercase;font-size:10px;letter-spacing:.08em;padding-top:2px}
.lib-detail .kv .v{color:var(--cream-2);font-family:var(--mono);word-break:break-word}
.lib-detail .section{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--cream-3);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--hair-soft)}
.lib-detail pre{background:var(--bg);padding:14px;border-radius:5px;font-family:var(--mono);font-size:11.5px;color:var(--cream-2);overflow-x:auto;line-height:1.6;border:1px solid var(--hair-soft)}
.lib-code{height:380px;border:1px solid var(--hair);border-radius:5px;overflow:hidden}
.lib-empty{color:var(--cream-3);font-size:12px;padding:40px 20px;text-align:center;font-family:var(--mono)}
</style>
</head><body>
<div class="lib-shell">
  <div class="lib-left">
    <div class="lib-header">
      <div class="lib-brand"><a href="/">SECSTREET</a> · LIBRARY</div>
      <input class="lib-search" id="q" placeholder="search the capability library" autocomplete="off" spellcheck="false">
      <div class="lib-count" id="count"></div>
    </div>
    <div class="lib-list" id="list"><div class="lib-empty">Loading…</div></div>
  </div>
  <div class="lib-right">
    <div class="lib-detail" id="detail"><div class="lib-empty">Pick a capability to inspect it.</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let editor = null;
let current = null;
let debounce = null;

async function api(path) {
  const r = await fetch(path);
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs" } });
require(["vs/editor/editor.main"], () => {
  monaco.editor.defineTheme("secstreet", {
    base: "vs-dark",
    inherit: true,
    rules: [
      { token: "comment", foreground: "7a6f64", fontStyle: "italic" },
      { token: "string", foreground: "c9a961" },
      { token: "keyword", foreground: "cf7a68" },
      { token: "number", foreground: "8ba5b8" },
      { token: "type", foreground: "8aad5c" }
    ],
    colors: {
      "editor.background": "#171310",
      "editor.foreground": "#ede4d6",
      "editorLineNumber.foreground": "#4a3f38",
      "editorLineNumber.activeForeground": "#d4b171",
      "editor.selectionBackground": "#3a302a",
      "editor.lineHighlightBackground": "#1d1815",
      "editorCursor.foreground": "#d4b171"
    }
  });
  load("");
});

function trustClass(t) {
  return ["community","professional","verified","restricted"].includes(t) ? t : "community";
}

async function load(q) {
  const data = await api("/api/library/search?q=" + encodeURIComponent(q));
  $("count").textContent = data.count + " result" + (data.count === 1 ? "" : "s");
  if (!data.results.length) {
    $("list").innerHTML = '<div class="lib-empty">no matches</div>';
    return;
  }
  $("list").innerHTML = data.results.map((r) =>
    '<div class="lib-row" data-name="' + r.name + '">' +
      '<div class="lname">' + r.name + '</div>' +
      '<div class="ldesc">' + escapeHtml(r.description) + '</div>' +
      '<div class="lmeta">' +
        '<span class="badge ' + trustClass(r.trust) + '">' + r.trust + '</span>' +
        '<span>' + r.risk + '</span>' +
        '<span>' + r.language + '</span>' +
        (r.score ? '<span style="margin-left:auto;color:var(--gold)">' + r.score + '</span>' : '') +
      '</div>' +
    '</div>'
  ).join("");
  for (const el of document.querySelectorAll(".lib-row")) {
    el.addEventListener("click", () => selectCap(el.dataset.name));
  }
  if (current && !data.results.find((r) => r.name === current)) current = null;
}

async function selectCap(name) {
  current = name;
  for (const el of document.querySelectorAll(".lib-row")) {
    el.classList.toggle("active", el.dataset.name === name);
  }
  const data = await api("/api/library/" + encodeURIComponent(name));
  const m = data.manifest;
  const perms = (m.permissions || []).join(", ") || "none";
  const tags = (m.tags || []).join(", ") || "—";
  $("detail").innerHTML =
    '<div class="dcrumb"><a href="/">SecStreet</a> / library / ' + m.name + '</div>' +
    '<h1>' + m.name + ' <span style="color:var(--cream-3);font-size:13px;font-weight:400">@' + m.version + '</span></h1>' +
    '<div class="ddesc">' + escapeHtml(m.description) + '</div>' +
    '<div class="kv">' +
      '<span class="k">trust</span><span class="v"><span class="badge ' + trustClass(m.trust) + '">' + m.trust + '</span></span>' +
      '<span class="k">risk</span><span class="v">' + m.risk + '</span>' +
      '<span class="k">language</span><span class="v">' + m.language + '</span>' +
      '<span class="k">permissions</span><span class="v">' + perms + '</span>' +
      '<span class="k">tags</span><span class="v">' + tags + '</span>' +
      '<span class="k">maintainer</span><span class="v">' + m.maintainer + '</span>' +
      '<span class="k">license</span><span class="v">' + (m.provenance && m.provenance.license ? m.provenance.license : "unknown") + '</span>' +
    '</div>' +
    '<div class="section">Input schema</div>' +
    '<pre>' + escapeHtml(JSON.stringify(data.inputSchema, null, 2)) + '</pre>' +
    '<div class="section">Output schema</div>' +
    '<pre>' + escapeHtml(JSON.stringify(data.outputSchema, null, 2)) + '</pre>' +
    '<div class="section">Entrypoint · ' + m.entrypoint + '</div>' +
    '<div class="lib-code" id="code"></div>';
  if (editor) { editor.dispose(); editor = null; }
  editor = monaco.editor.create($("code"), {
    value: data.entrypointCode || "(no code)",
    language: "javascript",
    theme: "secstreet",
    fontSize: 12.5,
    fontFamily: "ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace",
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    readOnly: true,
    padding: { top: 10 },
    tabSize: 2
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => load(e.target.value), 120);
});
</script>
</body></html>
