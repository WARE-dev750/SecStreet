<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecStreet Library</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/library.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
</head><body>
<nav class="navbar navbar-expand navbar-light bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="/">
      <span class="text-primary">■</span> SECSTREET <span class="text-muted fw-normal">/ library</span>
    </a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/">
        <i class="bi bi-code-square me-1"></i>Workspace
      </a>
    </div>
  </div>
</nav>

<div class="lib-shell">
  <div class="lib-left">
    <div class="lib-header">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
        <input id="q" class="form-control border-start-0" placeholder="Search the capability library" autocomplete="off" spellcheck="false">
      </div>
      <div class="text-muted small mt-2" id="count"></div>
    </div>
    <div class="lib-list" id="list">
      <div class="lib-empty">Loading…</div>
    </div>
  </div>
  <div class="lib-right">
    <div class="lib-detail" id="detail">
      <div class="lib-empty">
        <i class="bi bi-box-seam fs-1 d-block mb-3 opacity-25"></i>
        Pick a capability to inspect it.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/library.js"></script>
</body></html>
