<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecStreet Library</title>
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/library.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
</head><body>
<div class="lib-shell">
  <div class="lib-left">
    <div class="lib-header">
      <div class="lib-brand">
        <a href="/">SECSTREET</a> <span style="color:var(--cream-4)">·</span> LIBRARY
        <a class="back" href="/">← Workspace</a>
      </div>
      <input class="lib-search" id="q" placeholder="search the capability library" autocomplete="off" spellcheck="false">
      <div class="lib-count" id="count"></div>
    </div>
    <div class="lib-list" id="list"><div class="lib-empty">Loading…</div></div>
  </div>
  <div class="lib-right">
    <div class="lib-detail" id="detail"><div class="lib-empty">Pick a capability to inspect it.</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/library.js"></script>
</body></html>
