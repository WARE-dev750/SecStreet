<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SecStreet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0e0e10;color:#d4d4d8;height:100vh;display:grid;grid-template-rows:40px 1fr}
header{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #27272a;gap:12px}
header h1{font-size:14px;font-weight:600;color:#fafafa}
header .proj{font-size:12px;color:#71717a}
header input{margin-left:auto;padding:4px 8px;background:#18181b;border:1px solid #27272a;color:#d4d4d8;font-family:inherit;font-size:12px;width:220px}
main{display:grid;grid-template-columns:240px 1fr 320px;overflow:hidden}
.panel{border-right:1px solid #27272a;overflow-y:auto;padding:12px}
.panel:last-child{border-right:none;border-left:1px solid #27272a}
.panel h2{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#71717a;margin-bottom:8px}
.item{padding:6px 8px;cursor:pointer;font-size:12px;border-radius:3px}
.item:hover{background:#18181b}
.item.active{background:#27272a;color:#fafafa}
.item .name{color:#d4d4d8}
.item .meta{color:#71717a;font-size:10px}
.detail{padding:16px;overflow-y:auto}
.detail h3{font-size:16px;margin-bottom:4px;color:#fafafa}
.detail .desc{color:#a1a1aa;font-size:13px;margin-bottom:16px}
.detail pre{background:#18181b;padding:10px;border-radius:4px;font-size:11px;overflow-x:auto;color:#d4d4d8;white-space:pre-wrap}
.detail textarea{width:100%;height:80px;padding:8px;background:#18181b;border:1px solid #27272a;color:#d4d4d8;font-family:ui-monospace,monospace;font-size:12px;border-radius:3px;resize:vertical}
.detail button{padding:6px 12px;background:#2563eb;border:none;color:white;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px;margin-top:8px}
.detail button:hover{background:#1d4ed8}
.audit-entry{font-size:11px;padding:4px 0;border-bottom:1px solid #18181b}
.audit-entry .ok{color:#22c55e}
.audit-entry .err{color:#ef4444}
.empty{color:#71717a;font-size:12px;padding:16px 0;text-align:center}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px}
.kv span{color:#71717a}
.meta-h{font-size:10px;text-transform:uppercase;color:#71717a;margin:14px 0 6px;letter-spacing:.5px}
.remote-input{width:100%;margin-top:6px;padding:4px;background:#18181b;border:1px solid #27272a;color:#d4d4d8;font-size:11px}
.remote-btn{margin-top:4px;width:100%;padding:4px;background:#18181b;border:1px solid #27272a;color:#d4d4d8;font-size:11px;cursor:pointer;font-family:inherit}
</style></head><body>
<header><h1>SecStreet</h1><span class="proj" id="projName"></span><input id="search" placeholder="filter capabilities"/></header>
<main>
<div class="panel"><h2>Installed</h2><div id="installed"></div>
<h2 style="margin-top:16px">Remote</h2><div id="remote" class="empty">set url</div>
<input id="remoteUrl" class="remote-input" placeholder="http://127.0.0.1:8787"/>
<button class="remote-btn" onclick="loadRemote()">Connect</button></div>
<div class="detail" id="detail"><div class="empty">Select a capability</div></div>
<div class="panel"><h2>Audit (last 50)</h2><div id="audit"></div></div>
</main>
<script>
let state={installed:[],selected:null};
const $=(id)=>document.getElementById(id);
async function api(p,o){const r=await fetch(p,o);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadProject(){const p=await api("/api/project");$("projName").textContent=p.name+"@"+p.version;state.installed=p.installed;renderInstalled()}
function renderInstalled(){const f=$("search").value.toLowerCase();const e=$("installed");
const caps=state.installed.filter(c=>!f||c.name.includes(f)||c.description.toLowerCase().includes(f));
if(!caps.length){e.innerHTML='<div class="empty">none</div>';return}
e.innerHTML=caps.map(c=>'<div class="item '+(state.selected===c.name?'active':'')+'" onclick="selectCap(\''+c.name+'\')"><div class="name">'+c.name+'</div><div class="meta">'+c.trust+' · '+c.risk+'</div></div>').join('')}
async function selectCap(n){state.selected=n;renderInstalled();
const m=await api("/api/capabilities/"+n);
$("detail").innerHTML=
'<h3>'+m.name+' <span style="color:#71717a;font-size:12px">@'+m.version+'</span></h3>'+
'<div class="desc">'+m.description+'</div>'+
'<div class="kv"><div><span>language</span> '+m.language+'</div><div><span>trust</span> '+m.trust+'</div><div><span>risk</span> '+m.risk+'</div><div><span>permissions</span> '+(m.permissions.join(", ")||"none")+'</div></div>'+
'<div class="meta-h">Input JSON</div><textarea id="inputJson">{}</textarea>'+
'<button onclick="runSelected()">Run</button><div id="runResult"></div>'}
async function runSelected(){const input=JSON.parse($("inputJson").value||"{}");
const r=await api("/api/run",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:state.selected,input})});
$("runResult").innerHTML='<div class="meta-h">Result ('+r.durationMs+'ms, exit '+r.exitCode+')</div><pre>'+(r.ok?r.stdout:(r.stderr||"failed"))+'</pre>';
loadAudit()}
async function loadAudit(){const {entries}=await api("/api/audit");
if(!entries.length){$("audit").innerHTML='<div class="empty">empty</div>';return}
$("audit").innerHTML=entries.slice().reverse().map(e=>'<div class="audit-entry"><span class="'+(e.outcome==='ok'?'ok':'err')+'">'+e.outcome+'</span> '+e.capability+'<br><span style="color:#71717a;font-size:10px">'+e.durationMs+'ms · exit '+e.exitCode+'</span></div>').join('')}
async function loadRemote(){const url=$("remoteUrl").value.trim();if(!url)return;
try{const {capabilities}=await api("/api/remote/list?url="+encodeURIComponent(url));
$("remote").innerHTML=capabilities.map(c=>'<div class="item"><div class="name">'+c.name+'</div><div class="meta">'+c.trust+' · '+c.version+'</div></div>').join('')}
catch(err){$("remote").innerHTML='<div class="empty">'+err.message+'</div>'}}
$("search").addEventListener("input",renderInstalled);
loadProject();loadAudit();setInterval(loadAudit,5000);
</script></body></html>
