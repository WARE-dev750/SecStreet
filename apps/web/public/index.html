<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecStreet</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
</head><body>
<div class="shell" id="shell">

  <div class="titlebar">
    <span class="brand">SECSTREET</span>
    <span class="crumb" id="crumb">project</span>
    <span class="spacer"></span>
    <button class="btn" id="btnPalette" title="Command palette (Ctrl+P)">⌘ Files</button>
    <button class="btn" id="btnToggleRight" title="Toggle right panel">Panel</button>
    <button class="btn" id="btnToggleBottom" title="Toggle bottom panel (Ctrl+`)">Console</button>
  </div>

  <div class="activity">
    <div class="icon active" data-view="explorer" title="Explorer">
      <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div class="icon" data-view="capabilities" title="Capabilities">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <div class="icon" data-view="workflows" title="Workflows">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6.5 7.5l4.5 9M17.5 7.5L13 16.5"/></svg>
    </div>
    <div class="icon" data-view="audit" title="Audit">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    </div>
    <div class="icon" data-view="registry" title="Registry">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
    </div>
    <div class="bottom">
      <div class="icon" id="btnSettings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </div>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-head"><span id="sidebarTitle">Explorer</span><button id="sidebarToggle" title="Hide">×</button></div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </div>

  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="editor-host" id="editorHost">
      <div class="empty-state" id="emptyState">
        <div class="empty-inner">
          <div class="empty-hint">No file open</div>
          <div class="empty-actions">
            <span><kbd>Ctrl</kbd>+<kbd>P</kbd> &nbsp;files</span>
            <span><kbd>Ctrl</kbd>+<kbd>`</kbd> &nbsp;console</span>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom" id="bottom">
      <div class="bottom-tabs">
        <div class="bt active" data-btab="output">Output</div>
        <div class="bt" data-btab="audit">Audit</div>
        <div class="bt" data-btab="problems">Problems</div>
        <div class="bt" data-btab="terminal">Terminal</div>
        <div class="bottom-spacer"></div>
        <button class="bottom-close" id="bottomClose" title="Close">×</button>
      </div>
      <div class="bottom-body" id="bottomBody"></div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="right-tabs">
      <div class="rt active" data-rtab="inspector">Inspector</div>
      <div class="rt" data-rtab="ai">AI</div>
    </div>
    <div class="right-body" id="rightBody"></div>
  </div>

  <div class="statusbar">
    <span class="item"><span class="dot"></span><span id="statusProject">project</span></span>
    <span class="item" id="statusFile">—</span>
    <span class="item" id="statusLang">plaintext</span>
    <span class="spacer"></span>
    <span class="item gold" id="statusCaps">0 caps</span>
    <span class="item" id="statusBranch">main</span>
    <span class="item" id="statusPort"></span>
  </div>
</div>

<div class="palette-wrap" id="paletteWrap">
  <div class="palette">
    <input id="paletteInput" placeholder="Type a file name…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body></html>
