<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecStreet</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
</head><body>

<nav class="navbar navbar-expand navbar-light bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold mb-0" href="/"><span class="text-primary">■</span> SECSTREET</a>
    <span class="navbar-text small text-muted ms-2" id="crumb">project</span>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" id="btnLibrary"><i class="bi bi-box-seam me-1"></i>Library</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnPalette"><i class="bi bi-search me-1"></i>Files</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnToggleBottom"><i class="bi bi-terminal me-1"></i>Console</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnToggleRight"><i class="bi bi-layout-sidebar-reverse"></i></button>
    </div>
  </div>
</nav>

<div class="ide-shell">
  <div class="activity-rail">
    <button class="rail-btn active" data-view="explorer" title="Explorer"><i class="bi bi-files"></i></button>
    <button class="rail-btn" data-view="capabilities" title="Capabilities"><i class="bi bi-grid-3x3-gap"></i></button>
    <button class="rail-btn" data-view="workflows" title="Workflows"><i class="bi bi-diagram-3"></i></button>
    <button class="rail-btn" data-view="audit" title="Audit"><i class="bi bi-list-check"></i></button>
    <button class="rail-btn" data-view="registry" title="Registry"><i class="bi bi-globe2"></i></button>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span id="sidebarTitle">Explorer</span>
      <button class="btn btn-sm btn-link text-muted p-0" id="sidebarToggle"><i class="bi bi-x"></i></button>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </aside>

  <main class="main" id="mainArea">
    <ul class="nav nav-tabs tabs-bar" id="tabs"></ul>
    <div class="breadcrumb-bar" id="breadcrumb"></div>
    <div class="main-content" id="mainContent">
      <div class="editor-host" id="editorHost">
        <div class="empty-state" id="emptyState">
          <div class="text-center">
            <i class="bi bi-file-earmark-code display-4 text-muted opacity-25"></i>
            <div class="text-muted mt-3">No file open</div>
            <div class="text-muted small mt-2">
              <kbd>Ctrl</kbd>+<kbd>P</kbd> files
              &nbsp;&nbsp;
              <kbd>Ctrl</kbd>+<kbd>`</kbd> console
            </div>
          </div>
        </div>
      </div>
      <div class="canvas-host" id="canvasHost"></div>
    </div>
    <div class="bottom-panel" id="bottom">
      <ul class="nav nav-tabs bottom-tabs">
        <li class="nav-item"><button class="nav-link active" data-btab="output">Output</button></li>
        <li class="nav-item"><button class="nav-link" data-btab="audit">Audit</button></li>
        <li class="nav-item"><button class="nav-link" data-btab="problems">Problems</button></li>
        <li class="nav-item"><button class="nav-link" data-btab="terminal">Terminal</button></li>
        <li class="ms-auto d-flex align-items-center pe-2"><button class="btn btn-sm btn-link text-muted p-0" id="bottomClose"><i class="bi bi-x-lg"></i></button></li>
      </ul>
      <div class="bottom-body" id="bottomBody"></div>
    </div>
  </main>

  <aside class="right-panel" id="right">
    <ul class="nav nav-tabs right-tabs">
      <li class="nav-item"><button class="nav-link active" data-rtab="inspector">Inspector</button></li>
      <li class="nav-item"><button class="nav-link" data-rtab="ai">AI</button></li>
      <li class="nav-item"><button class="nav-link" data-rtab="library">Library</button></li>
    </ul>
    <div class="right-body" id="rightBody"></div>
  </aside>
</div>

<footer class="status-bar">
  <span><i class="bi bi-circle-fill text-success" style="font-size:6px"></i> <span id="statusProject">project</span></span>
  <span class="text-muted" id="statusFile">—</span>
  <span class="text-muted" id="statusLang">plaintext</span>
  <span class="ms-auto" id="statusCaps">0 caps</span>
  <span class="text-muted" id="statusBranch">main</span>
  <span class="text-muted" id="statusPort"></span>
</footer>

<div class="palette-backdrop" id="paletteWrap">
  <div class="palette">
    <input id="paletteInput" placeholder="Type a file name…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/icons.js"></script>
<script src="/canvas.js"></script>
<script src="/app.js"></script>
</body></html>
