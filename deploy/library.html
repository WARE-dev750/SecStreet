<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library — SecStreet</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.min.css">
<link rel="stylesheet" href="/library.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.css">
</head><body>

<nav class="top">
  <div class="container row">
    <a class="brand" href="/"><span class="dot"></span>SecStreet</a>
    <div class="nav-links">
      <a href="/library" class="active">Library</a>
      <a href="/sandboxes.html">Sandboxes</a>
      <a href="/community.html">Community</a>
      <a href="/#how">How it works</a>
      <a href="/#start">Get started</a>
    </div>
    <a class="nav-cta" href="/#start">Install CLI</a>
  </div>
</nav>

<div class="lib-shell">
  <aside class="lib-left">
    <div class="lib-header">
      <div class="search-wrap">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
        <input id="q" placeholder="Search the library" autocomplete="off" spellcheck="false">
      </div>
      <div class="chip-row">
        <button class="chip active" data-cat="all">All</button>
        <button class="chip" data-cat="defensive">Defensive</button>
        <button class="chip" data-cat="offensive">Offensive</button>
        <button class="chip" data-cat="neutral">Neutral</button>
      </div>
      <div class="lib-count" id="count"></div>
    </div>
    <div class="lib-list" id="list">
      <div class="lib-empty">Loading…</div>
    </div>
  </aside>
  <main class="lib-right">
    <div class="lib-detail" id="detail">
      <div class="lib-detail-empty">
        <div class="empty-glyph">■</div>
        <div class="empty-text">Pick a capability</div>
        <div class="empty-hint">Search on the left. Click to inspect the manifest, schemas, and source.</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/library.js"></script>
</body></html>
